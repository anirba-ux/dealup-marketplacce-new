<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <meta name="theme-color" content="#1565d8" />

    <title>DealUp - You're Offline</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        font-family:
          Arial,
          Helvetica,
          sans-serif;
        background: #f8fafc;
        color: #0f172a;
      }

      .container {
        width: 100%;
        max-width: 520px;
        padding: 48px 32px;
        text-align: center;
        background: #ffffff;
        border-radius: 24px;
        box-shadow: 0 20px 50px rgba(15, 23, 42, 0.08);
      }

      .icon {
        width: 80px;
        height: 80px;
        margin: 0 auto 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        background: rgba(21, 101, 216, 0.1);
        font-size: 38px;
      }

      h1 {
        margin: 0 0 12px;
        font-size: 32px;
      }

      p {
        margin: 0 auto 28px;
        max-width: 400px;
        color: #64748b;
        line-height: 1.7;
        font-size: 16px;
      }

      button {
        border: none;
        border-radius: 12px;
        padding: 14px 28px;
        background: #1565d8;
        color: #ffffff;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
      }

      button:hover {
        background: #0f52ba;
      }
    </style>
  </head>

  <body>
    <main class="container">
      <div class="icon">📡</div>

      <h1>You're Offline</h1>

      <p>
        It looks like your internet connection is unavailable.
        Please reconnect to the internet and try again.
      </p>

      <button onclick="window.location.reload()">
        Try Again
      </button>
    </main>
  </body>
</html>
